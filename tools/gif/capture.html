<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<style>
  /* Captures an animated figure as a grid of frames in one canvas, so a single
     headless screenshot yields every frame. tools/gif/make_gifs.py slices it.

     The figures are driven SYNCHRONOUSLY through the _captureFrame hook each
     module exposes: n simulation steps, one redraw, snapshot, repeat, all in
     one script task. Nothing waits on requestAnimationFrame or timers, so the
     frame count is exact and there is nothing for Chrome's screenshot timing
     to race. (Earlier versions sampled on a timer and got 1 to 41 frames from
     identical settings.)

     The live figure sits in the viewport at almost zero opacity so its
     IntersectionObserver never pauses it; the opaque grid canvas covers it. */
  html, body { margin: 0; padding: 0; background: #fff; }
  #stage { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.01; pointer-events: none; }
  #strip { display: block; background: #fff; }
  .fig-card, .landscape-hero { margin: 0 !important; border: none !important; box-shadow: none !important; }
  .fig-bar, .landscape-hero-bar, .fig-caption, .landscape-hero-caption { display: none !important; }
  .fig-canvas-trace { border-top: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="strip"></canvas>

<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var FIG = Q.get("fig") || "hero";
  var COLS = parseInt(Q.get("cols") || "6", 10);
  var ROWS = parseInt(Q.get("rows") || "6", 10);
  var FW = parseInt(Q.get("fw") || "1000", 10);
  var EVERY = parseInt(Q.get("every") || "1", 10);      // simulation ticks per captured frame
  var FSCALE = Q.get("fscale") || "1";
  var DSF = window.devicePixelRatio || 1;

  var stage = document.getElementById("stage");
  var srcW, srcH, sources = [], hookCanvas;

  if (FIG === "hero") {
    srcW = 1000; srcH = 650;
    stage.style.width = srcW + "px";
    stage.innerHTML =
      '<figure class="landscape-hero" id="landscapeHero" data-font-scale="' + FSCALE + '">' +
        '<div class="landscape-hero-bar">' +
          '<input type="range" id="heroTemp" min="0.22" max="0.70" step="0.01" value="0.40">' +
          '<span id="heroTempVal" class="mono"></span>' +
          '<button type="button" id="heroPlay">Play</button>' +
        '</div>' +
        '<canvas id="landscapeCanvas" class="landscape-canvas" style="height:380px"></canvas>' +
        '<canvas id="traceCanvas" class="trace-canvas" style="height:270px"></canvas>' +
        '<figcaption class="landscape-hero-caption">' +
          '<strong id="heroReadoutE"></strong><strong id="heroReadoutState"></strong>' +
          '<strong id="heroReadoutN"></strong><strong id="heroReadoutTP"></strong>' +
          '<span id="heroHint"></span>' +
        '</figcaption>' +
      '</figure>';
    sources = ["landscapeCanvas", "traceCanvas"];
  } else {
    srcW = 700; srcH = 550;
    stage.style.width = srcW + "px";
    stage.innerHTML =
      '<figure class="fig-card" id="zmwFigure">' +
        '<div class="fig-bar">' +
          '<input type="range" min="50" max="200" step="10" value="100" data-zmw-aperture>' +
          '<span class="mono" data-zmw-aperture-val></span>' +
          '<input type="range" min="-0.3" max="2" step="0.1" value="0.7" data-zmw-conc>' +
          '<span class="mono" data-zmw-conc-val></span>' +
          '<button type="button" data-zmw-play>Play</button>' +
        '</div>' +
        '<canvas class="fig-canvas" data-figure="zmw" style="height:380px" data-zmw-speed="' + (Q.get("speed") || "1") + '" data-font-scale="' + FSCALE + '"></canvas>' +
        '<canvas class="fig-canvas fig-canvas-trace" data-zmw-trace style="height:170px"></canvas>' +
        '<figcaption class="fig-caption">' +
          '<strong class="mono" data-zmw-out-l></strong><strong class="mono" data-zmw-out-v></strong>' +
          '<strong class="mono" data-zmw-out-n></strong><strong class="mono" data-zmw-out-nc></strong>' +
        '</figcaption>' +
      '</figure>';
    sources = ['[data-figure="zmw"]', '[data-zmw-trace]'];
  }

  var FH = Math.round(FW * srcH / srcW);
  var strip = document.getElementById("strip");
  strip.width = COLS * FW;
  strip.height = ROWS * FH;
  // at device scale factor 2 the screenshot is twice the CSS size, so the grid
  // is laid out at half size and comes out 1:1 with its backing pixels
  strip.style.width = (COLS * FW / DSF) + "px";
  strip.style.height = (ROWS * FH / DSF) + "px";
  var sctx = strip.getContext("2d");
  sctx.fillStyle = "#fff";
  sctx.fillRect(0, 0, strip.width, strip.height);

  function grab(sel) {
    return sel.charAt(0) === "[" ? document.querySelector(sel) : document.getElementById(sel);
  }

  function snap(i) {
    var dx = (i % COLS) * FW, dy = Math.floor(i / COLS) * FH, oy = 0;
    for (var k = 0; k < sources.length; k++) {
      var c = grab(sources[k]);
      var h = Math.round(FW * c.clientHeight / c.clientWidth);
      sctx.drawImage(c, 0, 0, c.width, c.height, dx, dy + oy, FW, h);
      oy += h;
    }
  }

  function setRange(el, value) {
    if (!el) return;
    el.value = value;
    el.dispatchEvent(new Event("input", { bubbles: true }));
  }

  function start() {
    if (FIG === "hero") {
      setRange(document.getElementById("heroTemp"), Q.get("kT") || "0.68");
      hookCanvas = document.getElementById("landscapeCanvas");
    } else {
      setRange(document.querySelector("[data-zmw-aperture]"), Q.get("d") || "120");
      setRange(document.querySelector("[data-zmw-conc]"), Q.get("c") || "0.7");
      hookCanvas = document.querySelector('[data-figure="zmw"]');
    }
    if (!hookCanvas || !hookCanvas._captureFrame) {
      document.title = "no hook";
      return;
    }
    var total = COLS * ROWS;
    for (var i = 0; i < total; i++) {
      hookCanvas._captureFrame(EVERY);
      snap(i);
    }
    document.title = "done " + total;
  }

  var s = document.createElement("script");
  s.src = FIG === "hero" ? "../../js/landscape-hero.js" : "../../js/zmw-figure.js";
  s.onload = function () {
    // draw with the real fonts, or with the fallback if they never arrive
    var ready = (document.fonts && document.fonts.ready) || Promise.resolve();
    var timeout = new Promise(function (r) { setTimeout(r, 3000); });
    Promise.race([ready, timeout]).then(function () { setTimeout(start, 50); });
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
