<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Social preview card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Rendered at exactly 1200x630 and saved to assets/img/og-card.png.
     See tools/og/README.md for the one command that regenerates it. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ffffff;
    color: #1f2328;
    font-family: "Public Sans", -apple-system, "Segoe UI", sans-serif;
    display: grid;
    grid-template-columns: 560px 1fr;
    align-items: center;
  }
  .left { padding: 58px 0 58px 64px; }
  .id { display: flex; align-items: center; gap: 20px; margin-bottom: 26px; }
  .id img { width: 96px; height: 96px; border-radius: 8px; object-fit: cover; border: 1px solid #d0d7de; }
  .role { font-size: 15px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #656d76; }
  .org { font-size: 18px; color: #1f2328; margin-top: 4px; }
  h1 { font-family: "Newsreader", Georgia, serif; font-size: 56px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.1; }
  .lede { font-family: "Newsreader", Georgia, serif; font-size: 27px; line-height: 1.35; color: #1f2328; margin-top: 18px; }
  .keys { font-size: 17px; color: #656d76; margin-top: 22px; }
  .url { font-size: 16px; color: #0969da; font-weight: 600; margin-top: 30px; }
  .right { height: 100%; display: flex; align-items: center; justify-content: center; background: #f6f8fa; border-left: 1px solid #d0d7de; padding: 40px 34px; }
  .right img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body>
  <div class="left">
    <div class="id">
      <img src="../../assets/img/portrait.jpg" alt="">
      <div>
        <div class="role">Postdoctoral Researcher</div>
        <div class="org">Weizmann Institute of Science</div>
      </div>
    </div>
    <h1>Dr. Satyaghosh Maurya</h1>
    <p class="lede">I watch single proteins change shape, and time the moment they do.</p>
    <p class="keys">Single-molecule biophysics &middot; Nanophotonics &middot; Chemical engineering</p>
    <p class="url">satyaghoshmaurya.github.io</p>
  </div>
  <div class="right">
    <img src="../../assets/img/research/landscape.png" alt="">
  </div>
</body>
</html>
